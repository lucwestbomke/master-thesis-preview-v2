[project]
name = "contested-relay"
version = "0.1.0"
description = "Adversarially robust multi-agent UAV relay under contested spectrum"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torch-geometric",
    # ⛔ skrl was REMOVED by docs/REDUCTION.md task 5, after four silent bugs.
    # `src/training/ppo.py` is the replacement: one file, ~350 lines, no
    # framework. Do not add an RL framework back without flagging it --
    # AGENTS.md lists heavy dependencies under "never do these".
    "osmnx",
    "shapely",
    "geopandas",
    "numpy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "gymnasium>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
