[project]
name = "contested-relay"
version = "0.1.0"
description = "Adversarially robust multi-agent UAV relay under contested spectrum"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torch-geometric",
    # ⚠️ Inherited, and scheduled for removal -- see docs/REDUCTION.md task 5.
    # skrl has produced four silent bugs in this project. The models inherit
    # from its Model/Mixin classes, so it cannot be dropped until they are
    # rewritten as plain nn.Modules alongside an own PPO.
    "skrl",
    "osmnx",
    "shapely",
    "geopandas",
    "numpy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "gymnasium>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
